Mur chauffant :
    supresseion mode démmarge                 OK
    supression mode veille                    OK  
    renomé mode normal en hiver               OK

    mode intersaison:
      sur plage hauraire (deux variable HA):
        demmarrage a heure ECS si (Tmp salon ou SDB 1 ou SDB 2 < variable consigne demmarage mur chauffant intersaison)
            circulateur en marche
            PID actif
            consigne de temperature (intersaison) variable HA
            activer relais 10 et 13 (seche serviette et murchauffant)
        
        arret sur temperature ballon haut <= consigne ECS

    mode manu:
        regulation PID active (comme auto)    OK
        tous le reste disponible HA           OK

planchée chauffant :
    supresseion mode démmarge                 OK 
    supression mode veille                    OK  
    renomé mode normal en hiver               OK

    mode manu:
        regulation PID active (comme auto)    OK
        tous le reste disponible HA           OK

ECS (electique):
    supression mode ECS1 et mode ECS2

    mode manu:
        les trois relais et le circulateur sont disponible HA

    mode intersaison:
        demmarage sur horaire ECS (variable HA) si poele arreté

    mode Hiver:
        arret electrique

    mode été:
        demmarage a heure ECS (variable HA) et arret a temperature arret ECS (variable HA)

    variable HA a créer:
        consigne Initial
        nombre personne présente
        coef par personne
        (nombre de personne (variable HA usint ) * coef (variable HA float) ) + temperature Initial (variable HA usint) = consigne ECS

        heure demmarage ECS           //TODO:
  
    arret le vendredi soir ou samedi matin a 70° (anti legionnel)
    effectué une rotation des resistance afin déquilibré l'usure.
    mode secours ci temperature ECS < consigne HA mode secours


poele :
    supression mode veille
    renomé mode normal en hiver

    modification mode hiver:
