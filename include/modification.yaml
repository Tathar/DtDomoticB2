    créé mode intersaison:
      demmarage sur horaire ECS
      arret sur consigne de température balon bas (variable HA consigne arret poele intersaison)

  gestion defaut poele:
    ci demande de marche et pas impultion vis pandant 10 minute
    reinitialisation du defaut a la demande de marche suivante ou premiere impulsion vis detecté
    envoi defaut HA
    arret circulateur en cas de defaut poele



